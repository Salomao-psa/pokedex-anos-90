<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Anos 90 | Consumo da PokéAPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="pokebola" aria-hidden="true"></div>
    <h1>Pokédex Anos 90</h1>
    <p>Os 151 Pokémon originais, carregados em tempo real da <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a></p>
  </header>

  <main>
    <section class="controles" aria-label="Filtros">
      <input type="search" id="busca" placeholder="Buscar por nome ou número..." aria-label="Buscar Pokémon">
      <select id="filtro-tipo" aria-label="Filtrar por tipo">
        <option value="">Todos os tipos</option>
      </select>
      <button id="btn-favoritos" type="button" aria-pressed="false">♥ Só favoritos (<span id="contador-fav">0</span>)</button>
    </section>

    <p id="status" role="status">Carregando Pokémon...</p>

    <!-- container vazio: os cards são criados pelo JavaScript -->
    <section id="cards" class="grid" aria-label="Lista de Pokémon"></section>

    <div class="mais">
      <button id="btn-mais" type="button">Carregar mais</button>
    </div>
  </main>

  <footer>
    <p>POKEDEX </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
